<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dashboard-member.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <title>Dasboard</title>
</head>

<body>
    <main>
        <div class="main-container">
            <div class="sidebar">

                <h2>DW Rental Car</h2>

                <div class="menu">

                    <button class="active">

                        <img src="/image/dashboard.png" alt="">
                        <span>Dashboard</span>

                    </button>

                    <button>

                        <img src="/image/katalog.png" alt="">
                        <span>Katalog Mobil</span>

                    </button>

                </div>

                <div class="exit">

                    <button>

                        <img src="/image/exit.png" alt="">
                        <span>Keluar</span>

                    </button>

                </div>

            </div>
            <div class="header">
                <h1 class="title">Dashboard</h1>
            </div>
            <div class="main">
                <div class="riwayat-transaksi">
                    <h2>Riwayat Rental</h2>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Mobil</th>
                                <th scope="col">Nopol</th>
                                <th scope="col">Tanggal Peminjaman</th>
                                <th scope="col">Deadline Pengembalian</th>
                                <th scope="col">Total Harga</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
    <script type="module" src="/Scripts/dashboardMember.js"></script>
</body>

</html>
