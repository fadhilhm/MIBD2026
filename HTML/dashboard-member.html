<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/CSS/dashboard-member.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <title>Dasboard</title>
</head>

<body>
    <main>
        <div class="main-container">
            <div class="sidebar">

                <h2>DW Rental Car</h2>

                <div class="menu">

                    <button class="active">

                        <img src="/image/dashboard.png" alt="">
                        <span>Dashboard</span>

                    </button>

                    <button>

                        <img src="/image/katalog.png" alt="">
                        <span>Katalog Mobil</span>

                    </button>

                </div>

                <div class="exit">

                    <button>

                        <img src="/image/exit.png" alt="">
                        <span>Keluar</span>

                    </button>

                </div>

            </div>
            <div class="header">
                <h1 class="title">Dashboard</h1>
            </div>
            <div class="main">
                <div class="riwayat-transaksi">

                    <h2>Riwayat Rental Terakhir</h2>

                    <table>

                        <tr>
                            <th>Kendaraan</th>
                            <th>Tanggal Peminjaman</th>
                            <th>Status</th>
                            <th>Total</th>
                        </tr>

                        <tr>
                            <td>Toyota Avanza</td>
                            <td>14 Januari 2026 - 27 Februari 2026</td>
                            <td>
                                <div class="status-container">
                                    <p id="active">Aktif</p>
                                    <p id="finish">Selesai</p>
                                    <p id="late">Telat</p>
                                </div>
                            </td>
                            <td>Rp. 10.000.000</td>
                        </tr>

                    </table>

                </div>

            </div>
        </div>

    </main>
    <script src="/Scripts/dashboardMember.js"></script>
</body>

</html>
